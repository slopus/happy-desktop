name: Windows chat scroll repro

on:
    push:
        branches:
            [
                "windows-scroll-repro**",
                "worktree/windows-scroll-repro**",
                "worktree/windows-chat-scroll-fixes**",
            ]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    browser:
        runs-on: windows-2025
        timeout-minutes: 45
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "24"
                  cache: pnpm
            - run: pnpm config set script-shell "C:\Program Files\Git\bin\bash.exe"
            - run: pnpm install --frozen-lockfile
            - run: pnpm --dir packages/happy-desktop-ui exec playwright install chromium
            - name: Run Chromium transcript suites
              run: |
                  mkdir -p .context/windows-browser
                  set -o pipefail
                  pnpm --dir packages/happy-desktop-ui exec vitest run --project chromium src/Conversation src/MessageList 2>&1 | tee .context/windows-browser/vitest.log
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              if: always()
              with:
                  name: windows-chat-browser
                  path: |
                      .context/windows-browser
                      packages/happy-desktop-ui/**/__screenshots__/**
                      packages/happy-desktop-ui/**/__diffs__/**
                  if-no-files-found: warn

    electron:
        runs-on: windows-2025
        timeout-minutes: 90
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "24"
                  cache: pnpm
            - run: pnpm config set script-shell "C:\Program Files\Git\bin\bash.exe"
            - run: pnpm install --frozen-lockfile
            - name: Install matching Agent preview
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  tag=v0.4.110-preview.12
                  version=${tag#v}
                  mkdir -p .context/happy-agent
                  gh release download "$tag" --repo slopus/happy-agent --pattern "happy-agent-${version}-win32-x64.tar.gz" --dir .context/happy-agent
                  tar -xzf ".context/happy-agent/happy-agent-${version}-win32-x64.tar.gz" -C .context/happy-agent
                  exe="$PWD/.context/happy-agent/happy-agent-win32-x64.exe"
                  "$exe" --version
                  printf 'HAPPY_DESKTOP_AGENT_EXECUTABLE=%s\n' "$(cygpath -w "$exe")" >> "$GITHUB_ENV"
                  printf 'HAPPY_DESKTOP_GYM_EXPECTED_AGENT_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
            - run: pnpm --dir packages/happy-desktop-electron build:profile:optimized
            - name: Probe Agent private-directory ACL setup
              run: |
                  mkdir -p .context/windows-electron .context/acl-probe
                  export HAPPY_PRIVATE_DIRECTORY="$(cygpath -w "$PWD/.context/acl-probe")"
                  cat > .context/acl-probe.ps1 <<'PS'
                  $ErrorActionPreference = 'Stop'
                  $target = Get-Item -LiteralPath $env:HAPPY_PRIVATE_DIRECTORY -Force
                  if (($target.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Private state cannot be a reparse point.' }
                  $identity = [Security.Principal.WindowsIdentity]::GetCurrent().User
                  $acl = [Security.AccessControl.DirectorySecurity]::new()
                  $acl.SetOwner($identity)
                  $acl.SetAccessRuleProtection($true, $false)
                  foreach ($sid in @($identity, [Security.Principal.SecurityIdentifier]::new('S-1-5-18'), [Security.Principal.SecurityIdentifier]::new('S-1-5-32-544'))) { $acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($sid, 'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow')) }
                  $target.SetAccessControl($acl)
                  PS
                  powershell.exe -NoLogo -NoProfile -NonInteractive -File "$(cygpath -w "$PWD/.context/acl-probe.ps1")" > .context/windows-electron/acl-probe.log 2>&1 || cat .context/windows-electron/acl-probe.log
            - name: Run Electron workloads
              run: |
                  mkdir -p .context/windows-electron
                  failed=0
                  for workload in streaming long-chat-scroll jump-shimmer mixed-replay; do
                    echo "Running $workload"
                    pnpm --dir packages/happy-desktop-gym gym:electron run --profile realistic --workload "$workload" --artifact-dir "$(cygpath -w "$PWD/.context/windows-electron/$workload")" > ".context/windows-electron/$workload.log" 2>&1 || { echo "$workload failed; see log"; failed=1; }
                  done
                  exit "$failed"
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              if: always()
              with:
                  name: windows-chat-electron
                  path: .context/windows-electron
                  if-no-files-found: warn

    row-height:
        strategy:
            fail-fast: false
            matrix:
                os: [windows-2025, ubuntu-latest]
                dpr: [1, 1.25, 1.5]
                headed: ["0"]
                include:
                    - os: windows-2025
                      dpr: 1.25
                      headed: "1"
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "24"
                  cache: pnpm
            - if: runner.os == 'Windows'
              run: pnpm config set script-shell "C:\Program Files\Git\bin\bash.exe"
            - run: pnpm install --frozen-lockfile
            - run: pnpm --dir packages/happy-desktop-ui exec playwright install chromium
            - name: Capture row height disagreements
              env:
                  HAPPY_SCROLL_REPRO_DPR: ${{ matrix.dpr }}
              run: |
                  mkdir -p .context/row-height
                  set -o pipefail
                  pnpm --dir packages/happy-desktop-ui exec vitest run --project chromium src/WindowsScrollRowHeight.test.tsx 2>&1 | tee .context/row-height/output.log
            - name: Capture trusted notched wheels during streaming
              env:
                  HAPPY_SCROLL_REPRO_DPR: ${{ matrix.dpr }}
                  HAPPY_SCROLL_REPRO_SMOOTH: "1"
                  HAPPY_SCROLL_REPRO_HEADED: ${{ matrix.headed }}
              run: |
                  set -o pipefail
                  for iteration in 1 2 3; do
                    pnpm --dir packages/happy-desktop-ui exec vitest run --project chromium src/WindowsNotchedWheel.test.tsx 2>&1 | tee ".context/row-height/wheel-$iteration.log" || exit 1
                  done
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              if: always()
              with:
                  name: row-height-${{ matrix.os }}-${{ matrix.dpr }}-headed-${{ matrix.headed }}
                  path: .context/row-height
                  if-no-files-found: warn
