name: Validate desktop on Linux and Windows

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            platform:
                description: Platforms to validate
                type: choice
                options: [all, windows, linux]
                default: all

permissions:
    contents: read

concurrency:
    group: desktop-validate-${{ github.ref }}
    cancel-in-progress: true

jobs:
    linux:
        if: ${{ inputs.platform != 'windows' }}
        name: Linux build, tests, and gym
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Check out source
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Set up pnpm
              uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "24"
                  cache: pnpm

            - name: Install display server and Electron libraries
              run: |
                  sudo apt-get update
                  sudo apt-get install -y xvfb libnss3 libgtk-3-0 libgbm1 libasound2t64

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck desktop source
              run: |
                  pnpm --dir packages/happy-desktop-electron typecheck
                  pnpm --dir packages/happy-desktop-app typecheck
                  pnpm --dir packages/happy-desktop-gym typecheck

            - name: Test application
              run: pnpm test

            - name: Install the matching released Happy Agent preview
              env:
                  GH_TOKEN: ${{ github.token }}
                  # Advance only after this exact preview is published and verified
                  # against Desktop's pinned SDK. Never fall back to another release.
                  HAPPY_DESKTOP_CI_AGENT_RELEASE_TAG: v0.4.110-preview.12
              run: |
                  set -euo pipefail
                  TAG="$HAPPY_DESKTOP_CI_AGENT_RELEASE_TAG"
                  [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-preview\.(0|[1-9][0-9]*)$ ]] || { echo 'CI requires an exact numbered Agent preview tag.' >&2; exit 1; }
                  RELEASE_STATE="$(gh release view "$TAG" --repo slopus/happy-agent \
                    --json tagName,isDraft,isPrerelease,publishedAt \
                    --jq '[.tagName, .isDraft, .isPrerelease, (.publishedAt != null)] | @tsv')"
                  [[ "$RELEASE_STATE" == "$TAG"$'\tfalse\ttrue\ttrue' ]] || { echo 'The exact Agent preview must be published, non-draft, and marked prerelease.' >&2; exit 1; }
                  VERSION="${TAG#v}"
                  mkdir -p "$RUNNER_TEMP/happy-agent"
                  gh release download "$TAG" --repo slopus/happy-agent \
                    --pattern "happy-agent-${VERSION}-linux-x64.tar.gz" \
                    --dir "$RUNNER_TEMP/happy-agent"
                  tar -xzf "$RUNNER_TEMP/happy-agent/happy-agent-${VERSION}-linux-x64.tar.gz" \
                    -C "$RUNNER_TEMP/happy-agent"
                  chmod +x "$RUNNER_TEMP/happy-agent/happy-agent-linux-x64"
                  ACTUAL_VERSION="$("$RUNNER_TEMP/happy-agent/happy-agent-linux-x64" --version)"
                  [[ "$ACTUAL_VERSION" == "Happy Agent $VERSION" ]] || { echo 'Downloaded Agent version does not match the selected release.' >&2; exit 1; }
                  printf 'HAPPY_DESKTOP_AGENT_EXECUTABLE=%s\n' \
                    "$RUNNER_TEMP/happy-agent/happy-agent-linux-x64" >> "$GITHUB_ENV"
                  printf 'HAPPY_DESKTOP_GYM_EXPECTED_AGENT_VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"

            - name: Build the optimized desktop profile
              run: pnpm --dir packages/happy-desktop-electron build:profile:optimized

            - name: Run the Electron gym boot workload
              env:
                  ELECTRON_DISABLE_SANDBOX: "1"
              run: |
                  xvfb-run --auto-servernum \
                    pnpm --dir packages/happy-desktop-gym gym:electron run \
                    --profile smoke --workload boot

            - name: Upload gym artifacts
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: happy-desktop-gym-linux
                  path: /tmp/hdg/*/artifacts/*
                  if-no-files-found: ignore

            - name: Package unsigned Linux builds
              run: pnpm --dir packages/happy-desktop-electron dist:linux

            - name: Upload Linux packages
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: happy-desktop-linux-unsigned
                  path: packages/happy-desktop-electron/release/*.AppImage
                  if-no-files-found: error

    windows:
        permissions:
            contents: read
            id-token: write
        if: ${{ inputs.platform != 'linux' }}
        uses: ./.github/workflows/build-windows.yml
