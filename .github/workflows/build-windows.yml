name: Build and install Windows Desktop

on:
    workflow_call:
        inputs:
            version:
                description: Version to embed, X.Y.Z or X.Y.Z-preview.N; empty uses the package version.
                type: string
                default: ""
            nightly_only:
                description: Build only Happy Nightly, for a Nightly-only preview.
                type: boolean
                default: false
            test_scope:
                description: >-
                    full runs every package's tests; preview runs only the Electron host's,
                    for a preview whose macOS verify job already ran the full set on this commit.
                type: string
                default: full
            agent_channel:
                description: >-
                    none, or the update channel (stable or preview) whose newest published
                    Agent to download, install, and boot through Desktop.
                type: string
                default: none
            release_analytics:
                description: Embed the PostHog key; only release builds send analytics.
                type: boolean
                default: false
        secrets:
            HAPPY_POSTHOG_API_KEY:
                description: PostHog project key, embedded only when release_analytics is true.
                required: false

permissions:
    contents: read

jobs:
    windows:
        permissions:
            contents: read
            id-token: write
        runs-on: windows-2025
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                flavor: ${{ fromJSON(inputs.nightly_only && '["local-web"]' || '["standard", "local-web"]') }}
        defaults:
            run:
                shell: bash
        # Every Windows build is signed; there is no unsigned build. Azure's GitHub
        # federation trusts only main, so any other ref stops before doing work.
        env:
            CSC_IDENTITY_AUTO_DISCOVERY: "false"
            CSC_LINK: ""
            WIN_CSC_LINK: ""
            WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
            WINDOWS_SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
            WINDOWS_SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
            WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
        steps:
            - name: Require main, the only ref that can sign
              if: github.ref != 'refs/heads/main'
              run: |
                  echo "Windows builds are always signed, and Azure signing trusts only main. Run this from main." >&2
                  exit 1
            - name: Check inputs
              env:
                  TEST_SCOPE: ${{ inputs.test_scope }}
                  AGENT_CHANNEL: ${{ inputs.agent_channel }}
              run: |
                  if [[ "$TEST_SCOPE" != full && "$TEST_SCOPE" != preview ]]; then
                    echo "test_scope must be full or preview, not '$TEST_SCOPE'." >&2
                    exit 1
                  fi
                  if [[ "$AGENT_CHANNEL" != none && "$AGENT_CHANNEL" != stable && "$AGENT_CHANNEL" != preview ]]; then
                    echo "agent_channel must be none, stable, or preview, not '$AGENT_CHANNEL'." >&2
                    exit 1
                  fi
            # A release build carries the PostHog key, and the Nightly flavor loads the
            # published renderer, which always does; CI must never count as a person.
            # The gym already launches under automation, which sends nothing; with
            # PostHog unreachable, no launch here could either.
            - name: Keep CI launches away from PostHog
              shell: pwsh
              run: |
                  Add-Content -Path "$env:SystemRoot\System32\drivers\etc\hosts" -Value "`r`n0.0.0.0 us.i.posthog.com`r`n:: us.i.posthog.com"
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "24"
                  cache: pnpm
            - name: Use Git Bash for package scripts
              run: pnpm config set script-shell "C:\Program Files\Git\bin\bash.exe"
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Typecheck desktop and gym
              run: |
                  pnpm --dir packages/happy-desktop-electron typecheck
                  pnpm --dir packages/happy-desktop-app typecheck
                  pnpm --dir packages/happy-desktop-gym typecheck
            - name: Test application
              if: inputs.test_scope == 'full'
              run: pnpm test
            # A preview tests what is Windows-specific: the Electron host process, with
            # its updater, update feed, and Agent download, install, versioning, daemon
            # paths, and named-pipe transport. The app, state, UI, and gym product suites
            # are platform-independent, and desktop-release.yml's macOS verify job, which
            # this build needs, has already passed the full `pnpm test` on this commit.
            - name: Test the Electron host
              if: inputs.test_scope == 'preview'
              run: pnpm --dir packages/happy-desktop-electron test
            # Once per run, on whichever flavor the run builds first.
            - name: Download and boot the published Windows Agent through Desktop's installer
              if: inputs.agent_channel != 'none' && matrix.flavor == (inputs.nightly_only && 'local-web' || 'standard')
              env:
                  AGENT_CHANNEL: ${{ inputs.agent_channel }}
                  GITHUB_TOKEN: ${{ github.token }}
              run: pnpm exec tsx scripts/verify-released-windows-agent.ts "$AGENT_CHANNEL"
            - name: Authenticate signing with GitHub OIDC
              uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
            # electron-builder installs TrustedSigning itself, but a PowerShell Gallery
            # hiccup can let that install exit cleanly without the module, failing the
            # first signature. Install a pinned version up front and prove it loads.
            - name: Install the Trusted Signing PowerShell module
              shell: pwsh
              run: |
                  $version = '0.5.8'
                  for ($attempt = 1; ; $attempt++) {
                      try {
                          Install-Module -Name TrustedSigning -RequiredVersion $version -Repository PSGallery -Scope CurrentUser -Force -ErrorAction Stop
                          Import-Module -Name TrustedSigning -RequiredVersion $version -ErrorAction Stop
                          break
                      } catch {
                          if ($attempt -ge 5) { throw }
                          Write-Warning "TrustedSigning install attempt $attempt failed: $_"
                          Start-Sleep -Seconds (10 * $attempt)
                      }
                  }
                  Get-Command Invoke-TrustedSigning -ErrorAction Stop | Out-Null
            - name: Build NSIS installer and update metadata
              env:
                  HAPPY_POSTHOG_API_KEY: ${{ inputs.release_analytics && secrets.HAPPY_POSTHOG_API_KEY || '' }}
                  RELEASE_VERSION: ${{ inputs.version }}
              run: pnpm desktop:win:release ${{ matrix.flavor }}
            - name: Install the actual release package
              shell: pwsh
              run: ./scripts/verify-windows-installer.ps1 -Flavor '${{ matrix.flavor }}'
            - name: Launch the installed application and verify its renderer
              env:
                  HAPPY_DESKTOP_GYM_PACKAGED: "1"
                  HAPPY_DESKTOP_GYM_SCREENSHOT: ${{ runner.temp }}/happy-installed.png
              run: pnpm --dir packages/happy-desktop-gym gym:electron smoke
            - name: Upload Windows release files
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: happy-desktop-windows-installer-${{ matrix.flavor }}
                  path: |
                      packages/happy-desktop-electron/release/${{ matrix.flavor }}/*.exe
                      packages/happy-desktop-electron/release/${{ matrix.flavor }}/*.blockmap
                      packages/happy-desktop-electron/release/${{ matrix.flavor }}/*.yml
                  if-no-files-found: error
            - name: Upload installed-app screenshot
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: happy-desktop-windows-${{ matrix.flavor }}-launch
                  path: ${{ runner.temp }}/happy-installed.png
                  if-no-files-found: error
