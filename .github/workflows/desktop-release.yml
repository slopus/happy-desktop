name: Release Happy Desktop
run-name: Release Happy Desktop ${{ inputs.version || (inputs.prerelease && 'next preview' || 'next stable') }}

on:
    workflow_dispatch:
        inputs:
            version:
                description: Optional. Empty computes the next YYYY.M.C or YYYY.M.C-preview.N from release tags; a given version must equal it
                required: false
                default: ""
                type: string
            release_notes:
                description: Markdown changelog to include in the GitHub Release
                required: true
                type: string
            prerelease:
                description: Preview by default; false requires an explicit production request and prior personal use of this candidate
                required: true
                default: true
                type: boolean
            nightly_only:
                description: Preview of Happy Nightly alone, without the standard macOS and Windows apps; requires prerelease
                required: false
                default: false
                type: boolean
            skip_local_web_x64:
                description: Skip Intel macOS Nightly and its macOS updater manifest for this preview
                required: false
                default: false
                type: boolean

permissions:
    contents: read

concurrency:
    group: release-macos-desktop
    cancel-in-progress: false

env:
    RELEASE_PRERELEASE: ${{ inputs.prerelease }}
    RELEASE_NIGHTLY_ONLY: ${{ inputs.nightly_only }}
    RELEASE_SKIP_LOCAL_WEB_X64: ${{ inputs.skip_local_web_x64 }}

jobs:
    linux:
        needs: verify
        # Linux has no Nightly flavor, so a Nightly-only preview builds no AppImage.
        if: ${{ !inputs.nightly_only }}
        uses: ./.github/workflows/build-linux.yml
        with:
            version: ${{ needs.verify.outputs.version }}
            release_analytics: true
        secrets:
            HAPPY_POSTHOG_API_KEY: ${{ secrets.HAPPY_POSTHOG_API_KEY }}

    windows:
        permissions:
            contents: read
            id-token: write
        needs: verify
        uses: ./.github/workflows/build-windows.yml
        with:
            version: ${{ needs.verify.outputs.version }}
            nightly_only: ${{ inputs.nightly_only }}
            # A preview runs the Windows-specific tests only; the verify job it needs has
            # already run the full `pnpm test` on this commit. Both prove onboarding
            # against the newest Agent their channel offers, without waiting for a new one.
            test_scope: ${{ inputs.prerelease && 'preview' || 'full' }}
            agent_channel: ${{ inputs.prerelease && 'preview' || 'stable' }}
            release_analytics: true
        secrets:
            HAPPY_POSTHOG_API_KEY: ${{ secrets.HAPPY_POSTHOG_API_KEY }}

    verify:
        name: Verify release inputs and source
        runs-on: macos-15
        timeout-minutes: 60
        outputs:
            version: ${{ steps.inputs.outputs.version }}

        steps:
            - name: Check out source
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0

            - name: Set up pnpm
              uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "24"
                  cache: pnpm

            - name: Verify release inputs and compute the version
              id: inputs
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_NOTES: ${{ inputs.release_notes }}
                  REQUESTED_VERSION: ${{ inputs.version }}
              run: |
                  if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
                    echo "Desktop releases must be dispatched from main." >&2
                    exit 1
                  fi
                  if [[ "$RELEASE_NIGHTLY_ONLY" == true && "$RELEASE_PRERELEASE" != true ]]; then
                    echo "A Nightly-only release must be a preview; stable releases ship every app." >&2
                    exit 1
                  fi
                  if [[ "$RELEASE_SKIP_LOCAL_WEB_X64" == true && "$RELEASE_PRERELEASE" != true ]]; then
                    echo "Skipping Intel macOS Nightly is only supported for previews." >&2
                    exit 1
                  fi
                  if [[ -z "${RELEASE_NOTES//[[:space:]]/}" ]]; then
                    echo "Release notes must not be blank." >&2
                    exit 1
                  fi
                  git fetch origin main --tags
                  if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
                    echo "Desktop releases must start from the current main branch." >&2
                    exit 1
                  fi
                  CHANNEL=stable
                  if [[ "$RELEASE_PRERELEASE" == true ]]; then CHANNEL=preview; fi
                  RELEASE_VERSION="$(node scripts/release/desktopVersion.mjs next "$CHANNEL" "$REQUESTED_VERSION")"
                  RELEASE_TAG="v$RELEASE_VERSION"
                  if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
                    echo "Tag $RELEASE_TAG already exists." >&2
                    exit 1
                  fi
                  if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                    echo "Release $RELEASE_TAG already exists." >&2
                    exit 1
                  fi
                  printf 'version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
                  printf 'Releasing Happy %s.\n' "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Test application
              run: pnpm test

    build:
        name: Build macOS ${{ matrix.arch }} ${{ matrix.flavor }}
        needs: verify
        strategy:
            fail-fast: false
            matrix:
                arch: [arm64, x64]
                flavor: [standard, local-web]
                # A Nightly-only preview builds no standard app at all.
                exclude:
                    - flavor: ${{ inputs.nightly_only && 'standard' || 'none' }}
                    - arch: x64
                      flavor: ${{ inputs.skip_local_web_x64 && 'local-web' || 'none' }}
                include:
                    - arch: arm64
                      runner: macos-15
                    - arch: x64
                      runner: macos-15-intel
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        env:
            RELEASE_VERSION: ${{ needs.verify.outputs.version }}
            APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
            APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
            APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
            APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
            CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
            CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}

        steps:
            - name: Check out source
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0

            - name: Set up pnpm
              uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "24"
                  cache: pnpm

            - name: Verify signing configuration
              run: |
                  test -n "$CSC_LINK"
                  test -n "$CSC_KEY_PASSWORD"
                  test -n "$APPLE_NOTARY_KEY_P8_BASE64"
                  test -n "$APPLE_API_KEY_ID"
                  test -n "$APPLE_API_ISSUER"
                  test -n "$APPLE_TEAM_ID"
                  test "$APPLE_TEAM_ID" = "466DQWDR8C"

            - name: Prepare App Store Connect API key
              run: |
                  NOTARY_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
                  printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 -D > "$NOTARY_KEY"
                  chmod 600 "$NOTARY_KEY"
                  printf 'APPLE_API_KEY=%s\n' "$NOTARY_KEY" >> "$GITHUB_ENV"

            # Universal Links for link.happy.page need com.slopus.happy's Developer ID
            # profile. Without the secret the standard app is signed as before, without
            # them; scripts/release/macUniversalLinks.mjs checks the profile and the result.
            - name: Prepare Developer ID provisioning profile
              if: matrix.flavor == 'standard'
              env:
                  MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
              run: |
                  if [[ -z "$MACOS_PROVISIONING_PROFILE_BASE64" ]]; then
                    echo "::notice::MACOS_PROVISIONING_PROFILE_BASE64 is not set; Happy for macOS is built without Universal Links."
                    exit 0
                  fi
                  # Outside the checkout: electron-builder embeds any profile it finds in
                  # the working directory.
                  PROFILE="$RUNNER_TEMP/happy-developer-id.provisionprofile"
                  printf '%s' "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE"
                  printf 'MACOS_PROVISIONING_PROFILE=%s\n' "$PROFILE" >> "$GITHUB_ENV"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck desktop source
              if: matrix.arch == 'arm64' && matrix.flavor == (inputs.nightly_only && 'local-web' || 'standard')
              run: |
                  pnpm --dir packages/happy-desktop-electron typecheck
                  pnpm --dir packages/happy-desktop-app typecheck

            - name: Build, sign, notarize, and verify desktop distribution
              env:
                  HAPPY_POSTHOG_API_KEY: ${{ secrets.HAPPY_POSTHOG_API_KEY }}
                  RELEASE_ARCH: ${{ matrix.arch }}
                  RELEASE_FLAVOR: ${{ matrix.flavor }}
              run: |
                  # GitHub's Intel runners drop Apple's CloudKit ticket lookup during
                  # electron-builder's `stapler staple`, which has no retry of its own.
                  set -o pipefail
                  for attempt in 1 2 3; do
                    log="$RUNNER_TEMP/desktop-mac-release-$attempt.log"
                    if pnpm desktop:mac:release -- --arch "$RELEASE_ARCH" --flavor "$RELEASE_FLAVOR" 2>&1 | tee "$log"; then exit 0; fi
                    grep -q 'Failed to staple your application with code: 68' "$log" || exit 1
                    echo "Apple's ticket lookup dropped while stapling (attempt $attempt/3)." >&2
                    [[ $attempt == 3 ]] || sleep $((120 * attempt))
                  done
                  exit 1

            - name: Remove App Store Connect API key and provisioning profile
              if: always()
              run: rm -f "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8" "$RUNNER_TEMP/happy-developer-id.provisionprofile"

            - name: Upload signed distribution
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: happy-desktop-macos-${{ matrix.arch }}-${{ matrix.flavor }}
                  retention-days: 7
                  compression-level: 0
                  # Keep the flavor directory under the first wildcard so the
                  # publish job merges all four artifacts into the same layout.
                  path: |
                      packages/happy-desktop-electron/release/*/*.dmg
                      packages/happy-desktop-electron/release/*/*.zip
                      packages/happy-desktop-electron/release/*/*.blockmap
                  if-no-files-found: error

            # Nothing publishes this copy; local-web-pages.yml deploys the hosted
            # renderer. Only a build users get carries the PostHog key.
            - name: Build hosted local renderer
              if: matrix.arch == 'arm64' && matrix.flavor == 'local-web'
              env:
                  HAPPY_LOCAL_WEB_BUILD_ID: ${{ needs.verify.outputs.version }}-${{ github.sha }}
              run: pnpm desktop:local:web

            - name: Upload hosted local renderer
              if: matrix.arch == 'arm64' && matrix.flavor == 'local-web'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: happy-desktop-local-web-site
                  path: packages/happy-desktop-electron/release/local-web-site
                  if-no-files-found: error

    publish:
        name: Publish GitHub Release
        if: ${{ !cancelled() && needs.verify.result == 'success' && needs.build.result == 'success' && needs.windows.result == 'success' && (needs.linux.result == 'success' || (inputs.nightly_only && needs.linux.result == 'skipped')) }}
        needs:
            - verify
            - build
            - windows
            - linux
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
        env:
            RELEASE_TAG: v${{ needs.verify.outputs.version }}
            RELEASE_VERSION: ${{ needs.verify.outputs.version }}

        steps:
            - name: Check out the verified commit
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0

            - name: Download signed artifacts
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  pattern: happy-desktop-macos-*
                  path: packages/happy-desktop-electron/release
                  merge-multiple: true

            - name: Download signed Windows artifacts
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  pattern: happy-desktop-windows-installer-*
                  path: packages/happy-desktop-electron/release/windows
                  merge-multiple: true

            - name: Confirm the release target
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  git fetch origin main --tags
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                    echo "The verified commit is no longer on main." >&2
                    exit 1
                  fi
                  if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null ||
                    gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                    echo "$RELEASE_TAG was taken while this release was building, likely by a renderer preview; re-dispatch to release as the next version." >&2
                    exit 1
                  fi

            - name: Download boot-verified Linux AppImages
              if: ${{ !inputs.nightly_only }}
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  pattern: happy-desktop-linux-*
                  path: packages/happy-desktop-electron/release/linux
                  merge-multiple: true

            - name: Create architecture-aware updater manifests
              run: |
                  if [[ "$RELEASE_NIGHTLY_ONLY" != true ]]; then
                    node scripts/create-mac-update-manifest.mjs standard
                  fi
                  if [[ "$RELEASE_SKIP_LOCAL_WEB_X64" != true ]]; then
                    node scripts/create-mac-update-manifest.mjs local-web
                  fi

            - name: Create tag and GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_NOTES: ${{ inputs.release_notes }}
              run: |
                  mkdir -p .release
                  printf '%s\n' "$RELEASE_NOTES" > .release/notes.md
                  node --input-type=module <<'NODE'
                  import { stat } from 'node:fs/promises';
                  import { desktopFlavorNames, desktopFlavorRead } from './scripts/desktopFlavors.mjs';
                  const flavorNames = process.env.RELEASE_NIGHTLY_ONLY === 'true' ? ['local-web'] : desktopFlavorNames;
                  for (const name of flavorNames) {
                    const flavor = desktopFlavorRead(name);
                    const directory = `packages/happy-desktop-electron/release/${flavor.output}`;
                    const skipIntelNightly = name === 'local-web' && process.env.RELEASE_SKIP_LOCAL_WEB_X64 === 'true';
                    const arches = skipIntelNightly ? ['arm64'] : ['arm64', 'x64'];
                    const files = [...(skipIntelNightly ? [] : [`${flavor.channel}-mac.yml`]), ...arches.flatMap(arch =>
                      ['dmg', 'zip', 'dmg.blockmap', 'zip.blockmap'].map(ext =>
                        `${flavor.artifactPrefix}-${process.env.RELEASE_VERSION}-${arch}.${ext}`))];
                    for (const file of files) {
                      const path = `${directory}/${file}`;
                      const info = await stat(path);
                      if (!info.isFile() || info.size === 0) throw new Error(`Missing or empty release asset: ${path}`);
                    }
                  }
                  for (const name of flavorNames) {
                    const flavor = desktopFlavorRead(name);
                    const installer = `${flavor.artifactPrefix}-${process.env.RELEASE_VERSION}-x64.exe`;
                    for (const file of [installer, `${installer}.blockmap`, `${flavor.channel}.yml`]) {
                      const path = `packages/happy-desktop-electron/release/windows/${file}`;
                      const info = await stat(path);
                      if (!info.isFile() || info.size === 0) throw new Error(`Missing or empty release asset: ${path}`);
                    }
                  }
                  if (process.env.RELEASE_NIGHTLY_ONLY !== 'true') {
                    for (const arch of ['x64', 'arm64']) {
                      const path = `packages/happy-desktop-electron/release/linux/Happy-${process.env.RELEASE_VERSION}-${arch}.AppImage`;
                      const info = await stat(path);
                      if (!info.isFile() || info.size === 0) throw new Error(`Missing or empty release asset: ${path}`);
                    }
                  }
                  NODE
                  shopt -s nullglob
                  macOutputs=(standard local-web)
                  windowsChannels=(latest nightly)
                  if [[ "$RELEASE_NIGHTLY_ONLY" == true ]]; then macOutputs=(local-web); windowsChannels=(nightly); fi
                  assets=()
                  for output in "${macOutputs[@]}"; do
                    assets+=(packages/happy-desktop-electron/release/"$output"/*.{dmg,zip,blockmap} packages/happy-desktop-electron/release/"$output"/*-mac.yml)
                  done
                  assets+=(packages/happy-desktop-electron/release/windows/*.{exe,blockmap})
                  for channel in "${windowsChannels[@]}"; do
                    assets+=(packages/happy-desktop-electron/release/windows/"$channel".yml)
                  done
                  if [[ "$RELEASE_NIGHTLY_ONLY" != true ]]; then
                    assets+=(packages/happy-desktop-electron/release/linux/*.AppImage)
                  fi
                  # Claim the tag atomically: creating an existing ref fails, where
                  # `gh release create` would silently adopt a renderer preview's tag.
                  if ! gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" >/dev/null; then
                    echo "$RELEASE_TAG was taken while this release was building, likely by a renderer preview; re-dispatch to release as the next version." >&2
                    exit 1
                  fi
                  arguments=("$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "Happy $RELEASE_TAG" --notes-file .release/notes.md)
                  if [[ "$RELEASE_PRERELEASE" == true ]]; then arguments+=(--prerelease --latest=false); fi
                  gh release create "${arguments[@]}" "${assets[@]}"
                  if [[ "$RELEASE_PRERELEASE" == true ]]; then
                    gh release edit "$RELEASE_TAG" --draft=false --latest=false
                  else
                    gh release edit "$RELEASE_TAG" --draft=false --latest
                  fi
                  RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq .url)"
                  printf 'Published [Happy %s](%s).\n' "$RELEASE_TAG" "$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
                  if [[ "$RELEASE_SKIP_LOCAL_WEB_X64" == true ]]; then
                    echo 'macOS Nightly (local-web) installs skip this release; manual arm64 download available.' >> "$GITHUB_STEP_SUMMARY"
                  fi
