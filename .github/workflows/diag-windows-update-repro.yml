# Throwaway diagnostics, branch diag/windows-update-repro only: reproduces a
# Windows setup failure after moving from Desktop 0.0.103 to 0.0.104-preview.4
# with the first install's Happy Agent daemon still running. Publishes nothing.
name: Diag Windows update repro

on:
    push:
        branches: [diag/windows-update-repro]

permissions:
    contents: read

jobs:
    repro:
        runs-on: windows-2025
        timeout-minutes: 75
        strategy:
            fail-fast: false
            matrix:
                # All start with stable 0.0.103 set up on Agent 0.4.114, then:
                # updater: Preview updates turned on; 0.0.103's updater installs 0.0.104-preview.4.
                # quit-mid-agent-download: Preview updates turned on; Happy quits while it
                #   fetches the Agent preview in the background; 0.0.104-preview.4 installed over it.
                # manual-preview: 0.0.104-preview.4 installed over it by hand, Preview updates on.
                # Each runs with Defender real-time protection on and the Windows
                # sandbox set up after first-run setup, as onboarding does.
                scenario: [updater, quit-mid-agent-download, manual-preview]
        defaults:
            run:
                shell: pwsh
        env:
            DO_NOT_TRACK: "1"
            OUT: ${{ github.workspace }}\diag-out
            GH_TOKEN: ${{ github.token }}
            SCENARIO: ${{ matrix.scenario }}
        steps:
            - name: Keep launches away from PostHog
              run: |
                  Add-Content -Path "$env:SystemRoot\System32\drivers\etc\hosts" -Value "`r`n0.0.0.0 us.i.posthog.com`r`n:: us.i.posthog.com"
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "24"
            - name: Tools and installers
              run: |
                  New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\drv", "$env:RUNNER_TEMP\inst", "$env:RUNNER_TEMP\handle", $env:OUT | Out-Null
                  Copy-Item .github/diag/drive.mjs "$env:RUNNER_TEMP\drv\drive.mjs"
                  Push-Location "$env:RUNNER_TEMP\drv"; npm init -y | Out-Null; npm i --no-audit --no-fund playwright-core@1.56.1; Pop-Location
                  Invoke-WebRequest https://download.sysinternals.com/files/Handle.zip -OutFile "$env:RUNNER_TEMP\handle.zip"
                  Expand-Archive "$env:RUNNER_TEMP\handle.zip" "$env:RUNNER_TEMP\handle"
                  gh release download v0.0.103 -R slopus/happy-desktop -p 'Happy-0.0.103-x64.exe' -D "$env:RUNNER_TEMP\inst"
                  gh release download v0.0.104-preview.4 -R slopus/happy-desktop -p 'Happy-0.0.104-preview.4-x64.exe' -D "$env:RUNNER_TEMP\inst"
                  Get-ChildItem "$env:RUNNER_TEMP\inst"
                  # A person's machine scans new executables; the runner's Defender is off by default.
                  Set-MpPreference -DisableRealtimeMonitoring $false
                  Start-Sleep 5
                  Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AntivirusEnabled, AMRunningMode | Format-List
            - name: Install stable 0.0.103
              run: |
                  $p = Start-Process "$env:RUNNER_TEMP\inst\Happy-0.0.103-x64.exe" -ArgumentList '/S' -PassThru -Wait
                  "installer exit $($p.ExitCode)"
                  $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles" -Recurse -Depth 2 -Filter 'Happy.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
                  "installed at $exe ($((Get-Item $exe).VersionInfo.ProductVersion))"
                  "HAPPY_EXE=$exe" >> $env:GITHUB_ENV
                  ./.github/diag/capture.ps1 -Label 0-installed-0.0.103 -Out $env:OUT
            - name: 0.0.103 first-run setup to Agent ready
              run: |
                  $env:DIAG_CDP_PORT = '9333'; $env:DIAG_PREVIEW = 'keep'; $env:DIAG_UNTIL = 'ready'
                  node "$env:RUNNER_TEMP\drv\drive.mjs" 1-setup-0.0.103 $env:HAPPY_EXE $env:OUT 12
                  ./.github/diag/capture.ps1 -Label 1-0.0.103-ready -Out $env:OUT
                  exit 0
            - name: Windows sandbox setup, as onboarding's Set up sandbox does
              if: always()
              run: |
                  $happy = "$env:USERPROFILE\.happy"
                  $selected = (Get-Content -Raw "$happy\dist\config.json" | ConvertFrom-Json).selectedVersion
                  $agent = "$happy\dist\version\$selected\happy-agent.exe"
                  "status before: $(& $agent sandbox status --json 2>&1)"
                  $job = Start-Job { param($a) & $a sandbox setup --json 2>&1 } -ArgumentList $agent
                  if (-not (Wait-Job $job -Timeout 600)) { 'sandbox setup timed out'; Stop-Job $job }
                  "setup: $(Receive-Job $job)"
                  "status after: $(& $agent sandbox status --json 2>&1)"
                  foreach ($path in @($happy, "$happy\dist", "$happy\dist\version", "$happy\dist\version\$selected", "$happy\dist\config.json", "$happy\windows-sandbox", "$happy\agent")) {
                      if (Test-Path $path) { "--- $path owner $((Get-Acl $path).Owner)"; icacls $path }
                  }
                  Get-ChildItem $happy -Force | Format-Table Name, LastWriteTime -AutoSize
                  ./.github/diag/capture.ps1 -Label 1b-after-sandbox-setup -Out $env:OUT
                  exit 0
            - name: Preview updates on in the running 0.0.103
              if: always() && matrix.scenario != 'manual-preview'
              run: |
                  $env:DIAG_CDP_PORT = '9333'; $env:DIAG_ATTACH = '1'; $env:DIAG_PREVIEW = 'on-after-ready'
                  $env:DIAG_UNTIL = if ($env:SCENARIO -eq 'updater') { 'update-downloaded' } else { 'agent-downloading' }
                  node "$env:RUNNER_TEMP\drv\drive.mjs" 1c-preview-on-0.0.103 $env:HAPPY_EXE $env:OUT 12
                  "DRIVE1_EXIT=$LASTEXITCODE" >> $env:GITHUB_ENV
                  ./.github/diag/capture.ps1 -Label 1c-0.0.103-preview-on -Out $env:OUT
                  exit 0
            - name: Leave 0.0.103 (daemon stays) for 0.0.104-preview.4
              if: always()
              run: |
                  function Quit-Happy {
                      taskkill /IM Happy.exe /T; Start-Sleep 6; taskkill /IM Happy.exe /T /F; Start-Sleep 2
                  }
                  if ($env:SCENARIO -eq 'updater' -and $env:DRIVE1_EXIT -eq '0') {
                      # The app's own updater quits it and runs the installer; wait for that.
                      $deadline = (Get-Date).AddMinutes(5)
                      while ((Get-Date) -lt $deadline) {
                          $v = (Get-Item $env:HAPPY_EXE -ErrorAction SilentlyContinue).VersionInfo.ProductVersion
                          $installer = Get-Process | Where-Object { $_.Path -match 'updater|Happy-0\.0\.104' }
                          if ($v -match '0\.0\.104' -and -not $installer) { break }
                          Start-Sleep 2
                      }
                      "installed version now $((Get-Item $env:HAPPY_EXE).VersionInfo.ProductVersion)"
                      Start-Sleep 15
                      ./.github/diag/capture.ps1 -Label 2a-updated-app-relaunched -Out $env:OUT
                      Quit-Happy
                  } else {
                      if ($env:SCENARIO -eq 'updater') { 'the Desktop update never arrived; installing it by hand instead' }
                      Quit-Happy
                      ./.github/diag/capture.ps1 -Label 2a-0.0.103-quit -Out $env:OUT
                      # What electron-updater runs for a silent update.
                      $p = Start-Process "$env:RUNNER_TEMP\inst\Happy-0.0.104-preview.4-x64.exe" -ArgumentList '--updated /S' -PassThru -Wait
                      "installer exit $($p.ExitCode); version now $((Get-Item $env:HAPPY_EXE).VersionInfo.ProductVersion)"
                      if ($env:SCENARIO -eq 'manual-preview') {
                          $path = "$env:USERPROFILE\.happy\desktop\config.json"
                          $config = if (Test-Path $path) { Get-Content -Raw $path | ConvertFrom-Json -AsHashtable } else { @{} }
                          $config.previewUpdatesEnabled = $true
                          $config | ConvertTo-Json -Depth 20 | Set-Content -Encoding utf8 $path
                      }
                  }
                  ./.github/diag/capture.ps1 -Label 2b-before-0.0.104-launch -Out $env:OUT
                  exit 0
            - name: 0.0.104-preview.4 launch, watched for 6 minutes
              if: always()
              run: |
                  $env:DIAG_CDP_PORT = '9334'; $env:DIAG_PREVIEW = 'keep'; $env:DIAG_UNTIL = 'deadline'
                  node "$env:RUNNER_TEMP\drv\drive.mjs" 3-0.0.104-preview.4 $env:HAPPY_EXE $env:OUT 6
                  ./.github/diag/capture.ps1 -Label 3-0.0.104-running -Out $env:OUT
                  taskkill /IM Happy.exe /T; Start-Sleep 6; taskkill /IM Happy.exe /T /F
                  Start-Sleep 2
                  ./.github/diag/capture.ps1 -Label 3b-0.0.104-quit -Out $env:OUT
                  exit 0
            - name: Reinstall 0.0.103 with fresh userData, watched for 5 minutes
              if: always()
              run: |
                  $uninstaller = Get-ChildItem (Split-Path $env:HAPPY_EXE) -Filter 'Uninstall*.exe' | Select-Object -First 1 -ExpandProperty FullName
                  "uninstalling with $uninstaller"
                  if ($uninstaller) { Start-Process $uninstaller -ArgumentList '/S' -Wait }
                  Start-Sleep 5
                  Remove-Item -Recurse -Force "$env:APPDATA\Happy" -ErrorAction SilentlyContinue
                  $p = Start-Process "$env:RUNNER_TEMP\inst\Happy-0.0.103-x64.exe" -ArgumentList '/S' -PassThru -Wait
                  "installer exit $($p.ExitCode); version now $((Get-Item $env:HAPPY_EXE).VersionInfo.ProductVersion)"
                  ./.github/diag/capture.ps1 -Label 4a-reinstalled-0.0.103 -Out $env:OUT
                  $env:DIAG_CDP_PORT = '9335'; $env:DIAG_PREVIEW = 'keep'; $env:DIAG_UNTIL = 'deadline'
                  node "$env:RUNNER_TEMP\drv\drive.mjs" 4-reinstall-0.0.103 $env:HAPPY_EXE $env:OUT 5
                  ./.github/diag/capture.ps1 -Label 4b-reinstall-running -Out $env:OUT
                  taskkill /IM Happy.exe /T /F
                  exit 0
            - name: Upload diagnostics
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: diag-${{ matrix.scenario }}
                  path: diag-out
                  retention-days: 5
