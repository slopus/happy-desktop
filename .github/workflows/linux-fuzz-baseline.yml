name: Linux WebKit fuzz instrumented comparison

on:
    push:
        branches: ["linux-fuzz-baseline-42150377920"]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    targeted-fuzz:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - revision: 3a20d9e5bda9f9bfe844f04e6fe4214c2c5a5008
                      label: preceding-product-tip
                    - revision: 3e1105cd5459819837138563e1eef4b3066502fe
                      label: newest-fix
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        env:
            HAPPY_TEST_DEPTH: full
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  ref: ${{ matrix.revision }}
            - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "24"
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Instrument identical seed and interaction durations
              run: |
                  python3 - <<'PY'
                  from pathlib import Path
                  path = Path('packages/happy-desktop-ui/src/ConversationInteractionFuzz.test.tsx')
                  source = path.read_text()
                  def replace_once(old, new):
                      global source
                      assert source.count(old) == 1, (old, source.count(old))
                      source = source.replace(old, new, 1)
                  replace_once('        const log: string[] = [];', '''        const log: string[] = [];
                          const seedStartedAt = performance.now();
                          let maxInteractionDurationMs = 0;
                          let measuredInteractions = 0;''')
                  replace_once('                expect(performance.now() - started, "interaction exceeded 2 seconds").toBeLessThan(', '''                const interactionDurationMs = performance.now() - started;
                                  maxInteractionDurationMs = Math.max(maxInteractionDurationMs, interactionDurationMs);
                                  measuredInteractions += 1;
                                  expect(interactionDurationMs, "interaction exceeded 2 seconds").toBeLessThan(''')
                  replace_once('                        depth: testDepth,', '''                        depth: testDepth,
                                          passed: true,
                                          durationMs: performance.now() - seedStartedAt,
                                          maxInteractionDurationMs,
                                          measuredInteractions,''')
                  replace_once('        } catch (error) {\n            const viewport = h.viewport();', '''        } catch (error) {
                              console.info("CHAT_FUZZ_RESULT " + JSON.stringify({
                                  browser: server.browser, seed, restore, short, depth: testDepth,
                                  passed: false, durationMs: performance.now() - seedStartedAt,
                                  maxInteractionDurationMs, measuredInteractions,
                              }));
                              const viewport = h.viewport();''')
                  path.write_text(source)
                  PY
                  mkdir -p .context/linux-fuzz-baseline
                  git diff -- packages/happy-desktop-ui/src/ConversationInteractionFuzz.test.tsx > .context/linux-fuzz-baseline/instrumentation.patch
            - name: Install browser dependencies
              timeout-minutes: 15
              run: pnpm --dir packages/happy-desktop-ui exec playwright install --with-deps webkit
            - name: Run three failing interaction seeds at full depth
              run: |
                  mkdir -p .context/linux-fuzz-baseline
                  git rev-parse HEAD | tee .context/linux-fuzz-baseline/revision.txt
                  set -o pipefail
                  pnpm --dir packages/happy-desktop-ui exec vitest run --project webkit src/ConversationInteractionFuzz.test.tsx --testNamePattern='seed (1021|4093|8191)\)' 2>&1 | tee .context/linux-fuzz-baseline/vitest.log
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              if: always()
              with:
                  name: linux-fuzz-${{ matrix.label }}-${{ matrix.revision }}
                  path: |
                      .context/linux-fuzz-baseline
                      packages/happy-desktop-ui/**/__screenshots__/**
                  if-no-files-found: warn