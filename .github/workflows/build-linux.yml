name: Build and boot Linux AppImages

on:
    workflow_call:
        inputs:
            version:
                description: Version to embed, X.Y.Z or X.Y.Z-preview.N; empty uses the package version.
                type: string
                default: ""
            release_analytics:
                description: Embed the PostHog key; only release builds send analytics.
                type: boolean
                default: false
        secrets:
            HAPPY_POSTHOG_API_KEY:
                description: PostHog project key, embedded only when release_analytics is true.
                required: false
    workflow_dispatch:

permissions:
    contents: read

jobs:
    linux:
        name: Linux AppImage ${{ matrix.arch }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: x64
                      runner: ubuntu-24.04
                    - arch: arm64
                      runner: ubuntu-24.04-arm
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "24"
                  cache: pnpm
            - name: Install display server and AppImage dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y xvfb libfuse2t64 libnss3 libgtk-3-0t64 libgbm1 libasound2t64
            - run: pnpm install --frozen-lockfile
            - name: Typecheck desktop and gym
              run: |
                  pnpm --dir packages/happy-desktop-electron typecheck
                  pnpm --dir packages/happy-desktop-gym typecheck
            - name: Build the standard desktop AppImage on its native architecture
              env:
                  HAPPY_POSTHOG_API_KEY: ${{ inputs.release_analytics && secrets.HAPPY_POSTHOG_API_KEY || '' }}
                  RELEASE_ARCH: ${{ matrix.arch }}
                  RELEASE_VERSION: ${{ inputs.version }}
              run: |
                  # Previews embed their version in the package without changing the source manifest.
                  export RELEASE_VERSION="${RELEASE_VERSION:-$(node -p "require('./package.json').version")}"
                  pattern='^[0-9]+\.[0-9]+\.[0-9]+(-preview\.(0|[1-9][0-9]*))?$'
                  if [[ ! "$RELEASE_VERSION" =~ $pattern ]]; then
                    echo "RELEASE_VERSION must be a stable or numbered preview version." >&2
                    exit 1
                  fi
                  pnpm --dir packages/happy-desktop-electron build
                  # AppImage normally rewrites x64 to x86_64. Keep the release
                  # filename contract shared with the cask and publish checks.
                  pnpm --dir packages/happy-desktop-electron exec electron-builder --linux AppImage --"$RELEASE_ARCH" --publish never \
                    --config.extraMetadata.version="$RELEASE_VERSION" \
                    --config.linux.artifactName="Happy-${RELEASE_VERSION}-${RELEASE_ARCH}.AppImage"
            - name: Boot the actual AppImage and verify its welcome screen
              env:
                  HAPPY_DESKTOP_GYM_PACKAGED: "1"
                  HAPPY_DESKTOP_GYM_SCREENSHOT: ${{ runner.temp }}/happy-appimage.png
                  ELECTRON_DISABLE_SANDBOX: "1"
                  RELEASE_ARCH: ${{ matrix.arch }}
                  RELEASE_VERSION: ${{ inputs.version }}
              run: |
                  VERSION="${RELEASE_VERSION:-$(node -p "require('./package.json').version")}"
                  export HAPPY_DESKTOP_ELECTRON_EXECUTABLE="$GITHUB_WORKSPACE/packages/happy-desktop-electron/release/Happy-${VERSION}-${RELEASE_ARCH}.AppImage"
                  chmod +x "$HAPPY_DESKTOP_ELECTRON_EXECUTABLE"
                  xvfb-run --auto-servernum pnpm --dir packages/happy-desktop-gym gym:electron smoke
            - name: Upload verified AppImage
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: happy-desktop-linux-${{ matrix.arch }}
                  path: packages/happy-desktop-electron/release/*.AppImage
                  if-no-files-found: error
            - name: Upload boot screenshot
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: happy-desktop-boot-linux-${{ matrix.arch }}
                  path: ${{ runner.temp }}/happy-appimage.png
                  if-no-files-found: ignore
