name: Release Nightly renderer preview
run-name: Renderer preview v${{ inputs.version }}

on:
    workflow_dispatch:
        inputs:
            version:
                description: Renderer preview version, X.Y.Z-preview.N
                required: true
                type: string
            release_notes:
                description: Markdown renderer changes
                required: true
                type: string

env:
    RELEASE_VERSION: ${{ inputs.version }}
    RELEASE_NOTES: ${{ inputs.release_notes }}

permissions:
    contents: read
    id-token: write
    pages: write

concurrency:
    group: local-web-pages
    cancel-in-progress: false

jobs:
    build:
        name: Build local web renderer
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Check out source
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0

            - name: Validate the requested renderer preview
              run: |
                  test "$GITHUB_REF" = refs/heads/main
                  [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-preview\.(0|[1-9][0-9]*)$ ]] || { echo 'Use X.Y.Z-preview.N.' >&2; exit 1; }
                  [[ -n "${RELEASE_NOTES//[[:space:]]/}" ]] || { echo 'Release notes must not be blank.' >&2; exit 1; }
                  git fetch origin main
                  test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

            - name: Set up pnpm
              uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "24"
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Configure GitHub Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Build local web renderer
              env:
                  HAPPY_LOCAL_WEB_BUILD_ID: ${{ inputs.version }}-${{ github.sha }}
              run: pnpm desktop:local:web

            - name: Record the renderer preview identity and notes
              run: |
                  printf '## Renderer preview %s\n\nSource: `%s`\n\n%s\n' "$RELEASE_VERSION" "$GITHUB_SHA" "$RELEASE_NOTES" >> "$GITHUB_STEP_SUMMARY"

            - name: Upload GitHub Pages artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: packages/happy-desktop-electron/release/local-web-site

    deploy:
        name: Deploy local web renderer
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy GitHub Pages
              id: deployment
              uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
