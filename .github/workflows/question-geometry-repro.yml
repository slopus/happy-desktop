name: Question geometry repro

on:
    push:
        branches: ["windows-question**"]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    question-geometry:
        strategy:
            fail-fast: false
            matrix:
                os: [windows-2025]
                zoom: [1, 1.25]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "24"
                  cache: pnpm
            - if: runner.os == 'Windows'
              run: pnpm config set script-shell "C:\Program Files\Git\bin\bash.exe"
            - run: pnpm install --frozen-lockfile
            - run: pnpm --dir packages/happy-desktop-ui exec playwright install chromium
            - name: Capture request card geometry
              env:
                  VITE_QUESTION_REPRO_ZOOM: ${{ matrix.zoom }}
                  HAPPY_SCROLL_REPRO_HEADED: ${{ runner.os == 'Windows' && '1' || '0' }}
              run: |
                  mkdir -p .context/question-geometry
                  set -o pipefail
                  pnpm --dir packages/happy-desktop-ui exec vitest run --project chromium src/WindowsQuestionGeometry.test.tsx 2>&1 | tee .context/question-geometry/output.log
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              if: always()
              with:
                  name: question-geometry-${{ matrix.os }}-${{ matrix.zoom }}
                  path: .context/question-geometry
                  if-no-files-found: warn
